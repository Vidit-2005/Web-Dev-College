
<!DOCTYPE html>
<html>

   <head>
      <title>HTML Target Frames</title>
   </head>
	
   <frameset cols = "200, *" framespacing="10" scrolling="yes" >
      <frame src = "menu.html" name = "menu_page" />
   <frameset rows = "60%, *" framespacing = "10" scrolling="yes">
      <frame src = "main.html" name = "main_page" />
   </frameset>

      </frameset>
      <noframes>
         <body>Your browser does not support frames.</body>
      </noframes>
   </frameset>
	
</html>
