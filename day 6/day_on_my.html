 write js program to check how many days left for the christmas from today date
</html>
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Days Until Christmas</title>
    <style> 
        body {
            font-family: Arial, sans-serif;
            padding: 40px;
        }
        button {
            padding: 8px;
            margin-top: 10px;
        }
        #result {
            margin-top: 15px;
            font-size: 18px;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <h2>Calculate Days Until Christmas</h2>
    <button onclick="daysUntilChristmas()">Get Days Left</button>
    <div id="result"></div>
    <script>
        function daysUntilChristmas() {
            const today = new Date();
            const currentYear = today.getFullYear();
            const christmas = new Date(currentYear, 11, 25); // December is month 11

            // If Christmas has already passed this year, calculate for next year
            if (today > christmas) {
                christmas.setFullYear(currentYear + 1);
            }

            const timeDifference = christmas - today;
            const daysLeft = Math.ceil(timeDifference / (1000 * 60 * 60 * 24));

            document.getElementById("result").innerText =
                "Days left until Christmas: " + daysLeft;
        }
    </script>
</body>
</html>
